# NOTE:
# [AI Citation] AI was used to generate the architecture of these services and the initial Docker Compose configuration. 
    # The AI was also used to generate the Kafka producer code and to integrate it into the existing Flask application.
services:
  # api1 is the schema owner and will initialize the database schema
  # api2 connects to the same database but does not attempt to create the schema
  api1:
    build: .
    container_name: api1
    environment:
      - DB_URL=postgresql://user:password@db/retro_games
      - SCHEMA_OWNER=true
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_started
    networks:
      - backend

  api2:
    build: .
    container_name: api2
    environment:
      - DB_URL=postgresql://user:password@db/retro_games
      - SCHEMA_OWNER=false
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_started
    networks:
      - backend

  # Nginx load balancer
  web:
    image: nginx:latest
    container_name: nginx_lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - backend

  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: retro_games
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  # Kafka cluster for email notifications
  kafka:
    image: bitnamilegacy/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LOG_DIRS=/tmp/kraft-combined-logs
      - ALLOW_PLAINTEXT_LISTENER=yes
    
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 20
    
    networks:
      - backend

  email_service:
    build: ./email_service
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api1
      - api2
    networks:
      - backend

  # Grafana for easier visualization of monitoring data
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend

# EXPORTERS
  kafka-exporter:
    image: danielqsj/kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    networks:
      - backend

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://user:password@db:5432/retro_games?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - backend

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    command:
      - -nginx.scrape-uri=http://nginx_lb/nginx_status
    ports:
      - "9113:9113"
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
